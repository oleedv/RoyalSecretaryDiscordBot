name: Deploy to Production

on:
  push:
    branches: [production]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

jobs:
  build:
    name: Build & Push Image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/RoyalInfrastructure

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            cat > .env.prod << EOF
            NODE_ENV=production
            GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BOT_IMAGE_TAG_PROD=latest
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=Royal_secretary_prod
            WEBSITE_DB_NAME=royal_battalion_prod
            MARIADB_ROOT_PASSWORD_PROD=${{ secrets.DB_ROOT_PASSWORD }}
            SQUADJS_SERVERS=${{ secrets.SQUADJS_SERVERS }}
            BM_TOKEN=${{ secrets.BM_TOKEN }}
            BM_SERVER_ID=${{ secrets.BM_SERVER_ID }}
            SFTP_HOST=${{ secrets.SFTP_HOST }}
            SFTP_PORT=${{ secrets.SFTP_PORT }}
            SFTP_USER=${{ secrets.SFTP_USER }}
            SFTP_PASS=${{ secrets.SFTP_PASS }}
            SFTP_PATH=${{ secrets.SFTP_PATH }}
            GIT_USER=${{ secrets.GIT_USER }}
            GIT_TOKEN=${{ secrets.GIT_TOKEN }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
            EOF

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull royal-secretary-bot
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d royal-secretary-bot
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wait for startup
        run: sleep 15

      - name: Verify container is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            STATUS=$(docker ps --filter name=royal-secretary-bot-prod --format "{{.Status}}")
            echo "Container status: ${STATUS}"

            if [ -z "$STATUS" ] || ! echo "$STATUS" | grep -q "Up"; then
              echo "Container is not running or crash-looping!"
              docker logs --tail 50 royal-secretary-bot-prod 2>&1 || true
              exit 1
            fi

            echo "Container is healthy"

  notify:
    name: Notify Discord
    needs: [build, deploy, health-check]
    if: always()
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Send webhook
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.deploy.result }}" = "success" ] && \
             [ "${{ needs.health-check.result }}" = "success" ]; then
            COLOR=3066993
            STATUS="Deployed"
          else
            FAILED=""
            [ "${{ needs.build.result }}" != "success" ] && FAILED="Build"
            [ "${{ needs.deploy.result }}" != "success" ] && FAILED="${FAILED:+$FAILED, }Deploy"
            [ "${{ needs.health-check.result }}" != "success" ] && FAILED="${FAILED:+$FAILED, }Health Check"
            COLOR=15158332
            STATUS="Failed (${FAILED})"
          fi

          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1 | jq -Rs .)

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"${STATUS}\",
              \"color\": ${COLOR},
              \"fields\": [
                { \"name\": \"Environment\", \"value\": \"Production\", \"inline\": true },
                { \"name\": \"Commit\", \"value\": \"\`${GITHUB_SHA::7}\`\", \"inline\": true },
                { \"name\": \"By\", \"value\": \"Ole\", \"inline\": true },
                { \"name\": \"Message\", \"value\": ${COMMIT_MSG} }
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "${{ secrets.DISCORD_DEPLOY_WEBHOOK }}"
