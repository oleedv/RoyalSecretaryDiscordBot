name: Deploy to Production

on:
  pull_request:
    branches: [production]
    types: [closed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

jobs:
  build-and-push:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:prod-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to production server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/RoyalInfrastructure

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            cat > .env.prod << EOF
            GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BOT_IMAGE_TAG_PROD=latest
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            MARIADB_ROOT_PASSWORD_PROD=${{ secrets.DB_ROOT_PASSWORD }}
            EOF

            docker compose -f docker-compose.prod.yml --env-file .env.prod pull royal-secretary-bot
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

            echo "Waiting for bot to start..."
            sleep 10
            docker ps --filter name=royal-secretary-bot-prod --format "{{.Names}}: {{.Status}}"
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

      - name: Notify Discord
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            STATUS="Deployed"
          else
            COLOR=15158332
            STATUS="Failed"
          fi

          COMMIT_MSG=$(echo '${{ github.event.pull_request.title }}' | jq -Rs .)

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"Production ${STATUS}\",
              \"color\": ${COLOR},
              \"fields\": [
                { \"name\": \"Environment\", \"value\": \"Production\", \"inline\": true },
                { \"name\": \"Commit\", \"value\": \"[\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})\", \"inline\": true },
                { \"name\": \"By\", \"value\": \"${{ github.actor }}\", \"inline\": true },
                { \"name\": \"Message\", \"value\": ${COMMIT_MSG} }
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "${{ secrets.DISCORD_DEPLOY_WEBHOOK }}"
