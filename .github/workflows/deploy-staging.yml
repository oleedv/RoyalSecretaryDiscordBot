name: Deploy to Staging

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to staging server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/RoyalInfrastructure

            cat > .env.staging << EOF
            GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BOT_IMAGE_TAG_STAGING=staging
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            MARIADB_ROOT_PASSWORD_STAGING=${{ secrets.DB_ROOT_PASSWORD }}
            MARIADB_DATABASE_STAGING=${{ secrets.DB_NAME }}
            MARIADB_USER_STAGING=${{ secrets.DB_USER }}
            MARIADB_PASSWORD_STAGING=${{ secrets.DB_PASSWORD }}
            EOF

            docker compose -f docker-compose.staging.yml --env-file .env.staging pull
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d

            echo "Waiting for bot to start..."
            sleep 10
            docker ps --filter name=royal-secretary-bot-staging --format "{{.Names}}: {{.Status}}"
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot
