name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ steps.version.outputs.version }}-staging

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/RoyalInfrastructure

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            cat > .env.staging << EOF
            GHCR_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            BOT_IMAGE_TAG_STAGING=staging
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_CLIENT_ID=${{ secrets.DISCORD_CLIENT_ID }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_NAME=Royal_secretary_staging
            WEBSITE_DB_NAME=royal_battalion_stg
            MARIADB_ROOT_PASSWORD_STAGING=${{ secrets.DB_ROOT_PASSWORD }}
            MARIADB_DATABASE_STAGING=Royal_secretary_staging
            MARIADB_USER_STAGING=${{ secrets.DB_USER }}
            MARIADB_PASSWORD_STAGING=${{ secrets.DB_PASSWORD }}
            SQUADJS_SERVERS=${{ secrets.SQUADJS_SERVERS }}
            BM_TOKEN=${{ secrets.BM_TOKEN }}
            BM_SERVER_ID=${{ secrets.BM_SERVER_ID }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}
            EOF

            docker compose -f docker-compose.staging.yml --env-file .env.staging pull royal-secretary-bot-staging
            docker compose -f docker-compose.staging.yml --env-file .env.staging up -d royal-secretary-bot-staging
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for startup
        run: sleep 15

      - name: Verify container is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            STATUS=$(docker ps --filter name=royal-secretary-bot-staging --format "{{.Status}}")
            echo "Container status: ${STATUS}"

            if [ -z "$STATUS" ] || ! echo "$STATUS" | grep -q "Up"; then
              echo "Container is not running or crash-looping!"
              docker logs --tail 50 royal-secretary-bot-staging 2>&1 || true
              exit 1
            fi

            echo "Container is healthy"
