name: Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:staging-${{ github.sha }}

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/RoyalInfrastructure

            echo ${{ secrets.GHCR_TOKEN }} | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            cat > .env.staging << EOF
            DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
            DISCORD_APPLICATION_ID=${{ secrets.DISCORD_APPLICATION_ID }}
            MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD }}
            MARIADB_DATABASE=${{ secrets.MARIADB_DATABASE }}
            MARIADB_USER=${{ secrets.MARIADB_USER }}
            MARIADB_PASSWORD=${{ secrets.MARIADB_PASSWORD }}
            EOF

            docker compose -f docker-compose.staging.yml pull royal-secretary-bot-staging
            docker compose -f docker-compose.staging.yml up -d royal-secretary-bot-staging
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository_owner }}/royalsecretarydiscordbot

  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Wait for startup
        run: sleep 15

      - name: Verify container is running
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            STATUS=$(docker ps --filter name=royal-secretary-bot-staging --format "{{.Status}}")
            echo "Container status: ${STATUS}"

            if [ -z "$STATUS" ]; then
              echo "Container is not running!"
              docker logs --tail 30 royal-secretary-bot-staging 2>&1 || true
              exit 1
            fi

            echo "Container is healthy"

  notify:
    name: Notify Discord
    needs: [build, deploy, health-check]
    if: always()
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Send webhook
        run: |
          if [ "${{ needs.build.result }}" = "success" ] && \
             [ "${{ needs.deploy.result }}" = "success" ] && \
             [ "${{ needs.health-check.result }}" = "success" ]; then
            COLOR=3066993
            STATUS="Deployed"
          else
            FAILED=""
            [ "${{ needs.build.result }}" != "success" ] && FAILED="Build"
            [ "${{ needs.deploy.result }}" != "success" ] && FAILED="${FAILED:+$FAILED, }Deploy"
            [ "${{ needs.health-check.result }}" != "success" ] && FAILED="${FAILED:+$FAILED, }Health Check"
            COLOR=15158332
            STATUS="Failed (${FAILED})"
          fi

          curl -s -H "Content-Type: application/json" -d "{
            \"embeds\": [{
              \"title\": \"${STATUS}\",
              \"color\": ${COLOR},
              \"fields\": [
                { \"name\": \"Environment\", \"value\": \"Staging\", \"inline\": true },
                { \"name\": \"Commit\", \"value\": \"[\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${GITHUB_SHA})\", \"inline\": true },
                { \"name\": \"By\", \"value\": \"${{ github.actor }}\", \"inline\": true },
                { \"name\": \"Message\", \"value\": $(echo '${{ github.event.head_commit.message }}' | head -1 | jq -Rs .) }
              ],
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" "${{ secrets.DISCORD_DEPLOY_WEBHOOK }}"
